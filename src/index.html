<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call of Duty — Operations Briefing</title>
<meta name="description" content="A fan-made Call of Duty concept site with a promo loop, interactive game lineup, features and updates." />
<style>
  :root{
    --bg:#0a0d0e;
    --bg-2:#0e1214;
    --panel:#121719;
    --panel-2:#171d20;
    --line:#293236;
    --line-strong:#3b484d;
    --text:#eef2ef;
    --muted:#98a4a1;
    --accent:#ff5a36;
    --accent-rgb:255,90,54;
    --signal:#d9ff43;
    --signal-rgb:217,255,67;
    --max:1140px;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 78% -10%, rgba(var(--accent-rgb),.10), transparent 60%),
      radial-gradient(800px 500px at 0% 30%, rgba(var(--signal-rgb),.05), transparent 60%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    color:var(--text);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);
    mask-image:linear-gradient(180deg,#000,transparent 85%);
    pointer-events:none;z-index:0;
  }

  :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
  .skip{position:absolute;left:-9999px;top:12px;z-index:100;padding:10px 14px;background:var(--signal);color:#0a0d0e;text-decoration:none;font-weight:700}
  .skip:focus{left:12px}
  .wrap{width:min(100% - 32px,var(--max));margin-inline:auto;position:relative;z-index:1}

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:16px clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);
    background:rgba(10,13,14,.82);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    transition:border-color .25s,background .25s;
  }
  .site-header.is-scrolled{border-color:var(--line-strong);background:rgba(10,13,14,.94)}
  .brand{display:inline-flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
  .brand-mark{
    display:grid;place-items:center;width:38px;height:38px;
    background:var(--accent);color:#0a0d0e;
    font-weight:900;font-size:13px;letter-spacing:-.04em;
    clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);
  }
  .brand-name{font-weight:800;letter-spacing:.16em;font-size:13px}
  .site-nav{display:flex;gap:clamp(12px,2.4vw,28px);flex-wrap:wrap}
  .site-nav a{
    color:var(--muted);text-decoration:none;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;
    padding:6px 0;border-bottom:1px solid transparent;
    transition:color .2s,border-color .2s;
  }
  .site-nav a:hover,.site-nav a:focus-visible{color:var(--text);border-color:var(--accent)}

  /* ---------- intro + promo loop ---------- */
  .intro{padding:clamp(32px,5vw,64px) 0 clamp(32px,5vw,56px);border-bottom:1px solid var(--line)}
  .eyebrow,.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--signal);font-weight:700}
  .lede{max-width:58ch;color:var(--muted);font-size:clamp(15px,1.6vw,18px)}

  .stage{
    --d:12s;
    position:relative;width:min(100%,960px);margin-inline:auto;
    aspect-ratio:16/9;overflow:hidden;
    background:#080b0c;border:1px solid var(--line-strong);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .grid{
    position:absolute;inset:-25%;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:44px 44px;
    transform:perspective(600px) rotateX(58deg) scale(1.6);
    transform-origin:center 72%;opacity:.8;
  }
  .glow{
    position:absolute;inset:0;
    background:
      radial-gradient(60% 55% at 72% 32%,rgba(var(--accent-rgb),.30),transparent 66%),
      radial-gradient(50% 60% at 8% 82%,rgba(var(--signal-rgb),.10),transparent 70%);
  }
  .slash{
    position:absolute;top:-20%;left:60%;width:11%;height:140%;
    background:var(--accent);transform:skewX(-22deg);opacity:.9;
  }
  .scan{
    position:absolute;left:0;right:0;top:-2%;height:2px;
    background:linear-gradient(90deg,transparent,var(--signal),transparent);
    opacity:0;filter:blur(.5px);
  }
  .vig{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.78) 100%);
  }
  .content{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
    gap:clamp(8px,1.6cqw,18px);
    padding:clamp(20px,6cqw,64px);
    container-type:inline-size;
  }
  .content .kicker{font-size:clamp(10px,1.7cqw,15px);letter-spacing:.3em}
  .title{
    position:relative;margin:0;
    font-family:"Arial Narrow",Impact,Arial,sans-serif;
    font-size:clamp(34px,9.5cqw,96px);
    line-height:.9;letter-spacing:-.01em;text-transform:uppercase;
    text-shadow:0 8px 34px rgba(0,0,0,.7);
  }
  .title::before,.title::after{
    content:attr(data-text);position:absolute;inset:0;
    opacity:0;mix-blend-mode:screen;
  }
  .title::before{color:#ff3b1f;transform:translate(-3px,1px)}
  .title::after{color:var(--signal);transform:translate(3px,-1px)}
  .sub{
    display:flex;align-items:center;gap:10px;
    font-size:clamp(12px,2.3cqw,22px);letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  }
  .sub::before{content:"";width:4px;height:1.1em;background:var(--accent)}
  .tagline{
    font-family:Consolas,"Courier New",monospace;
    font-size:clamp(11px,2.3cqw,21px);letter-spacing:.1em;color:var(--muted);
  }
  .tagline span{
    display:inline-block;white-space:nowrap;overflow:hidden;width:23ch;
    border-right:2px solid var(--signal);vertical-align:bottom;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{
    padding:6px 10px;border:1px solid rgba(255,255,255,.22);
    background:rgba(0,0,0,.35);
    font-size:clamp(9px,1.4cqw,12px);letter-spacing:.16em;text-transform:uppercase;
  }
  .cta{margin-top:8px}
  .cta span{
    display:inline-block;padding:clamp(11px,1.8cqw,17px) clamp(20px,3.4cqw,34px);
    background:var(--accent);color:#080b0c;font-weight:900;
    font-size:clamp(12px,2cqw,19px);letter-spacing:.18em;text-transform:uppercase;
    clip-path:polygon(0 0,100% 0,100% 70%,94% 100%,0 100%);
  }
  .progress{position:absolute;left:0;bottom:0;width:100%;height:3px;background:rgba(255,255,255,.09);z-index:4}
  .progress span{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
  .fade{position:absolute;inset:0;background:var(--bg);opacity:0;z-index:5;pointer-events:none}

  .promo-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
  .promo-controls button{
    border:1px solid var(--line-strong);background:var(--panel);color:var(--text);
    padding:9px 16px;font:inherit;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;transition:border-color .2s;
  }
  .promo-controls button:hover{border-color:var(--accent)}
  .intro-caption{display:grid;gap:8px;margin-top:24px;max-width:64ch}
  .intro-caption .lede{margin:0}

  /* ---- promo timeline ---- */
  .stage.play .grid       { animation:gridIn    var(--d) linear infinite }
  .stage.play .glow       { animation:gridIn    var(--d) linear infinite }
  .stage.play .slash      { animation:slashIn   var(--d) linear infinite }
  .stage.play .scan       { animation:scan      var(--d) linear infinite }
  .stage.play .kicker     { animation:kickerIn  var(--d) linear infinite }
  .stage.play .title      { animation:titleIn   var(--d) linear infinite }
  .stage.play .title::before{ animation:glitchA var(--d) linear infinite }
  .stage.play .title::after { animation:glitchB var(--d) linear infinite }
  .stage.play .sub        { animation:subIn     var(--d) linear infinite }
  .stage.play .tagline span{ animation:type var(--d) steps(26,end) infinite, caret .5s steps(1,end) infinite }
  .stage.play .chip:nth-child(1){ animation:chipA var(--d) linear infinite }
  .stage.play .chip:nth-child(2){ animation:chipB var(--d) linear infinite }
  .stage.play .chip:nth-child(3){ animation:chipC var(--d) linear infinite }
  .stage.play .cta        { animation:ctaIn var(--d) linear infinite }
  .stage.play .cta span   { animation:ctaPulse 1.5s ease-in-out infinite }
  .stage.play .progress span{ animation:progress var(--d) linear infinite }
  .stage.play .fade       { animation:fade var(--d) linear infinite }

  @keyframes gridIn{0%{opacity:0}4%{opacity:.85}90%{opacity:.85}100%{opacity:0}}
  @keyframes slashIn{0%{opacity:0;transform:skewX(-22deg) translateX(-60px)}8%{opacity:.9;transform:skewX(-22deg) translateX(0)}88%{opacity:.9}96%{opacity:0}}
  @keyframes scan{0%{top:-2%;opacity:0}2%{opacity:.9}11%{top:102%;opacity:0}100%{top:102%;opacity:0}}
  @keyframes kickerIn{0%,6%{opacity:0;transform:translateX(-18px)}11%,90%{opacity:1;transform:translateX(0)}96%,100%{opacity:0}}
  @keyframes titleIn{0%,13%{opacity:0;clip-path:inset(48% 0 48% 0)}24%,90%{opacity:1;clip-path:inset(0 0 0 0)}96%,100%{opacity:0}}
  @keyframes glitchA{0%,22%{opacity:0}23%{opacity:.85;transform:translate(-4px,2px)}24.5%{opacity:0}25.5%{opacity:.7;transform:translate(3px,-2px)}26.5%,100%{opacity:0}}
  @keyframes glitchB{0%,22.4%{opacity:0}23.4%{opacity:.8;transform:translate(4px,-1px)}24.8%{opacity:0}25.8%{opacity:.65;transform:translate(-3px,2px)}26.8%,100%{opacity:0}}
  @keyframes subIn{0%,27%{opacity:0;transform:translateY(16px)}35%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
  @keyframes type{0%,37%{width:0}53%,94%{width:23ch}100%{width:0}}
  @keyframes caret{0%,50%{border-color:var(--signal)}51%,100%{border-color:transparent}}
  @keyframes chipA{0%,48%{opacity:0;transform:translateY(12px) scale(.9)}55%,90%{opacity:1;transform:translateY(0) scale(1)}96%,100%{opacity:0}}
  @keyframes chipB{0%,51%{opacity:0;transform:translateY(12px) scale(.9)}58%,90%{opacity:1;transform:translateY(0) scale(1)}96%,100%{opacity:0}}
  @keyframes chipC{0%,54%{opacity:0;transform:translateY(12px) scale(.9)}61%,90%{opacity:1;transform:translateY(0) scale(1)}96%,100%{opacity:0}}
  @keyframes ctaIn{0%,62%{opacity:0;transform:scale(.88)}70%,88%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1.04)}}
  @keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.45)}70%,100%{box-shadow:0 0 0 16px rgba(var(--accent-rgb),0)}}
  @keyframes progress{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes fade{0%{opacity:1}4%{opacity:0}94%{opacity:0}99%,100%{opacity:1}}

  /* ---------- sections ---------- */
  .section{padding:clamp(56px,8vw,96px) 0;border-bottom:1px solid var(--line)}
  .section--alt{background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
  .section-head{display:grid;gap:10px;margin-bottom:36px}
  .section-head h2{
    margin:0;
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    font-size:clamp(28px,4.5vw,46px);
    line-height:1;letter-spacing:.01em;text-transform:uppercase;
  }
  .section-sub{max-width:62ch;margin:0;color:var(--muted)}

  /* ---------- interactieve balk ---------- */
  .game-bar{
    display:flex;gap:6px;overflow-x:auto;
    border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .game-tab{
    flex:0 0 auto;position:relative;
    appearance:none;border:1px solid transparent;border-bottom:0;
    background:transparent;color:var(--muted);cursor:pointer;
    padding:14px 18px;
    font:700 12px/1 "Segoe UI",Arial,sans-serif;
    letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
    transition:color .2s,background .2s,border-color .2s;
  }
  .game-tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
  .game-tab[aria-selected="true"]{color:var(--text);border-color:var(--line);background:var(--panel)}
  .game-tab[aria-selected="true"]::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
  }

  .game-panel[hidden]{display:none}
  .game-panel:not([hidden]){
    display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);
    border:1px solid var(--line);border-top:0;
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    animation:panelIn .32s ease both;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel-main{min-width:0}
  .panel-art{
    position:relative;height:170px;overflow:hidden;
    background:linear-gradient(135deg,rgba(var(--c1),.30),rgba(var(--c2),.10)),#0c1012;
    border-bottom:1px solid var(--line);
  }
  .panel-art::before{
    content:"";position:absolute;inset:-30% -10% auto auto;
    width:78%;height:190%;transform:rotate(22deg);
    background:linear-gradient(90deg,transparent,rgba(var(--c1),.22),transparent);
  }
  .panel-art::after{
    content:"";position:absolute;width:190px;height:190px;
    right:-45px;top:-60px;border:1px solid rgba(255,255,255,.12);border-radius:50%;
    box-shadow:0 0 0 24px rgba(255,255,255,.03),0 0 0 48px rgba(255,255,255,.02);
  }
  .panel-index{
    position:absolute;left:20px;bottom:-16px;
    font:800 84px/1 "Arial Narrow",Arial,sans-serif;
    color:rgba(255,255,255,.09);letter-spacing:-.06em;
  }
  .panel-text{padding:clamp(20px,3vw,34px)}
  .panel-tag{
    margin:0 0 8px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--signal);font-weight:700;
  }
  .panel-text h3{
    margin:0 0 10px;
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    font-size:clamp(26px,3.4vw,40px);line-height:1;text-transform:uppercase;
  }
  .panel-desc{margin:0;color:var(--muted);font-size:15px;max-width:58ch}
  .panel-facts{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}
  .fact{border-left:2px solid var(--accent);padding-left:10px}
  .fact span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .fact strong{font-size:14px;font-weight:700}

  .panel-side{
    padding:clamp(20px,3vw,34px);
    border-left:1px solid var(--line);
    background:rgba(0,0,0,.22);
    display:flex;flex-direction:column;justify-content:center;gap:12px;
  }
  .price-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .price{
    font:800 clamp(38px,5vw,58px)/1 "Arial Narrow",Arial,sans-serif;
    letter-spacing:-.02em;color:var(--text);
  }
  .price-note{margin:0;font-size:13px;color:var(--muted)}
  .panel-side .btn{margin-top:6px;align-self:flex-start}
  .panel--blackops{--c1:255,90,54;--c2:255,180,60}
  .panel--modern{--c1:90,140,255;--c2:120,220,255}
  .panel--spectre{--c1:200,80,220;--c2:255,90,120}
  .panel--warzone{--c1:217,255,67;--c2:90,160,120}

  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .feature{
    display:grid;grid-template-columns:auto 1fr;gap:16px;
    padding:22px;border:1px solid var(--line);background:rgba(255,255,255,.02);
    transition:border-color .25s,background .25s;
  }
  .feature:hover{border-color:var(--line-strong);background:rgba(255,255,255,.035)}
  .feature-num{font:800 13px/1.6 "Arial Narrow",Arial,sans-serif;color:var(--accent)}
  .feature h3{margin:0 0 6px;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
  .feature p{margin:0;color:var(--muted);font-size:14px}

  .newsletter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
  .newsletter h2{
    margin:12px 0;
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    font-size:clamp(30px,5vw,52px);line-height:1;text-transform:uppercase;
  }
  .newsletter p{margin:0;color:var(--muted);max-width:46ch}
  .signup-form{display:flex;flex-wrap:wrap;gap:10px;padding:20px;border:1px solid var(--line);background:var(--panel)}
  .signup-form label{width:100%;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .signup-form input[type=email]{
    flex:1 1 240px;min-width:0;padding:14px 16px;
    background:#0b0f10;border:1px solid var(--line-strong);
    color:var(--text);font:inherit;font-size:15px;outline:none;
  }
  .signup-form input[type=email]:focus{border-color:var(--accent)}
  .btn{
    display:inline-block;text-align:center;text-decoration:none;
    appearance:none;border:0;cursor:pointer;padding:14px 22px;
    font:700 12px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    color:#0a0d0e;background:var(--accent);
    clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%);
    transition:filter .2s,transform .2s;
  }
  .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .form-message{width:100%;min-height:1.5em;margin:4px 0 0;font-size:13px;color:var(--muted)}
  .form-message.is-success{color:var(--signal)}
  .form-message.is-error{color:#ff8a70}

  .site-footer{padding:28px 0 40px;color:var(--muted);font-size:12px}
  .footer-inner{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .reveal.is-visible{opacity:1;transform:none}

  @media (max-width:760px){
    .site-header{flex-wrap:wrap}
    .newsletter{grid-template-columns:1fr}
    .game-panel:not([hidden]){grid-template-columns:1fr}
    .panel-side{border-left:0;border-top:1px solid var(--line)}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    .reveal{opacity:1;transform:none}
    .stage *,.stage *::before,.stage *::after{animation:none!important}
    .stage .fade{opacity:0!important}
    .stage .progress span{transform:scaleX(1)!important}
  }
</style>
</head>
<body>
    fdss
    <div class="Nav">
        <h1>Call Of Duty</h1>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Fan-made concept. Call of Duty is a trademark of Activision.</span>
    <span>Built for the briefing.</span>
  </div>
</footer>

<script>
(function(){
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.12, rootMargin:'0px 0px -40px 0px' });
    reveals.forEach(function(el){ io.observe(el); });
  } else {
    reveals.forEach(function(el){ el.classList.add('is-visible'); });
  }

  var form = document.getElementById('signup');
  if (form) {
    form.addEventListener('submit', function(event){
      event.preventDefault();
      var input = document.getElementById('email');
      var message = document.getElementById('form-message');
      var value = (input.value || '').trim();
      var valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);

      if (!valid) {
        message.textContent = 'Enter a valid email address to receive the briefing.';
        message.className = 'form-message is-error';
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }

      message.textContent = 'You are on the list. Stand by for the next drop.';
      message.className = 'form-message is-success';
      input.removeAttribute('aria-invalid');
      form.reset();
    });
  }

  var header = document.querySelector('.site-header');
  function onScroll(){
    if (!header) return;
    header.classList.toggle('is-scrolled', window.scrollY > 24);
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive:true });

  var stage = document.getElementById('promo');
  var replay = document.getElementById('replay');
  if (stage && replay) {
    replay.addEventListener('click', function(){
      stage.classList.remove('play');
      void stage.offsetWidth;
      stage.classList.add('play');
    });
  }

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.game-tab'));
  var panels = Array.prototype.slice.call(document.querySelectorAll('.game-panel'));

  function activateTab(tab, moveFocus){
    tabs.forEach(function(item){
      var active = item === tab;
      item.setAttribute('aria-selected', active ? 'true' : 'false');
      item.tabIndex = active ? 0 : -1;
    });
    panels.forEach(function(panel){
      panel.hidden = panel.id !== tab.getAttribute('aria-controls');
    });
    if (moveFocus) tab.focus();
  }

  tabs.forEach(function(tab, index){
    tab.addEventListener('click', function(){ activateTab(tab, false); });
    tab.addEventListener('keydown', function(event){
      var next = null;
      if (event.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
      else if (event.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length];
      else if (event.key === 'Home') next = tabs[0];
      else if (event.key === 'End') next = tabs[tabs.length - 1];
      if (next) { event.preventDefault(); activateTab(next, true); }
    });
  });
})();
</script>
</body>
</html>
